AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: FloodSense AI backend (Lambda, API Gateway, DynamoDB, SNS, S3, EventBridge)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 20
    CodeUri: .
    Environment:
      Variables:
        REPORTS_TABLE: !Ref ReportsTable
        RISK_TABLE: !Ref RiskTable
        ALERT_TOPIC: !Ref AlertTopic
        PHOTO_BUCKET: !Ref PhotoBucket

Resources:
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: zone, AttributeType: S}, {AttributeName: ts, AttributeType: N}]
      KeySchema: [{AttributeName: zone, KeyType: HASH}, {AttributeName: ts, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: expires, Enabled: true}

  RiskTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: zone, AttributeType: S}]
      KeySchema: [{AttributeName: zone, KeyType: HASH}]

  AlertTopic:
    Type: AWS::SNS::Topic

  PhotoBucket:
    Type: AWS::S3::Bucket

  PostReportFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.post_report
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ReportsTable}
        - S3WritePolicy: {BucketName: !Ref PhotoBucket}
      Events:
        Api: {Type: Api, Properties: {Path: /reports, Method: post}}

  GetRiskFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.get_risk
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref RiskTable}
      Events:
        Api: {Type: Api, Properties: {Path: /risk, Method: get}}

  SubscribeFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.subscribe
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sns:Subscribe
              Resource: !Ref AlertTopic
      Events:
        Api: {Type: Api, Properties: {Path: /subscribe, Method: post}}

  ScoreZonesFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.score_zones
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref RiskTable}
        - DynamoDBReadPolicy: {TableName: !Ref ReportsTable}
        - SNSPublishMessagePolicy: {TopicName: !GetAtt AlertTopic.TopicName}
      Events:
        Schedule: {Type: Schedule, Properties: {Schedule: "rate(15 minutes)"}}

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  AlertTopicArn:
    Value: !Ref AlertTopic
